spring.datasource.url=jdbc:h2:mem:rota;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=locadora
spring.flyway.default-schema=locadora
spring.flyway.locations=classpath:db/migration
app.demo.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
